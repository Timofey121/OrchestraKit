name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build tools
        run: python -m pip install 'setuptools>=68' wheel build
      - name: Python tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Frontend checks and build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node --test src/*.test.js
          npm run build
      - name: Check generated UI and whitespace
        run: |
          git diff --exit-code -- src/orchestra_kit/web/app.js
          git diff --check
      - name: Build distributions
        run: python -m build --no-isolation

  windows-portable:
    # Native executor process groups require POSIX; use WSL for that path.
    # Check the standalone installer and dashboard on Windows itself.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installation and dashboard smoke test
        run: python -m unittest tests.test_portability -v
