name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build tools
        run: python -m pip install 'setuptools>=68' wheel build
      - name: Python tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Start disposable Linux user manager
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Real dashboard service lifecycle
        env:
          PYTHONPATH: src
          ORCHESTRA_NATIVE_UI_TEST: '1'
        run: python -m unittest tests.test_ui_service_native -v
      - name: Frontend checks and build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          node --test src/*.test.js
          npm run build
      - name: Check generated UI and whitespace
        run: |
          git diff --exit-code -- src/orchestra_kit/web/app.js
          git diff --check
      - name: Build distributions
        run: python -m build --no-isolation

  windows-portable:
    # Native executor process groups require POSIX; use WSL for that path.
    # Check the standalone installer and dashboard on Windows itself.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installation and dashboard smoke test
        run: python -m unittest tests.test_portability tests.test_state tests.test_check_portability tests.test_file_metadata tests.test_diagnostics tests.test_workflow_comparison tests.test_stage1_cli tests.test_repair_context tests.test_memory tests.test_navigation tests.test_handoff tests.test_stage2_cli tests.test_consultation tests.test_consultation_cli tests.test_questions tests.test_questions_cli tests.test_ui_service_windows -v
      - name: Read-only repeated installation and drift repair
        run: python -m unittest tests.test_install.InstallTests.test_current_install_succeeds_with_all_filesystem_writes_denied tests.test_install.InstallTests.test_setup_rechecks_content_before_skipping_writes -v
      - name: Real Windows dashboard service lifecycle
        env:
          ORCHESTRA_NATIVE_UI_TEST: '1'
        run: python -m unittest tests.test_ui_service_native -v
