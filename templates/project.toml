version = 1
name = "__PROJECT_NAME__"

[orchestration]
max_parallel = 3
default_profile = "strong"

# adaptive: root keeps small work and delegates only useful independent tracks.
# strict: every implementation leaf and the final result receive independent review.
# program: leaf, work-package, and final review gates for larger programs.
[workflow]
mode = "adaptive"
max_repair_cycles = 2
fresh_worker_per_leaf = true
fresh_reviewer_always = true
review_levels = ["final"]
checkpoint_policy = "manual"
git_publication = "human-controlled"

# Optional project-owned Markdown policies, applied in listed order.
[context]
policy_files = []

# Profiles express intent. Change only model/effort/provider mappings per project.
[profiles.cheap]
model = "gpt-5.6-luna"
effort = "medium"

[profiles.balanced]
model = "gpt-5.6-terra"
effort = "high"

[profiles.strong]
model = "gpt-5.6-sol"
effort = "high"

[profiles.critical]
model = "gpt-6-astra"
effort = "high"

[roles.explorer]
description = "Read-only explorer that gathers repository evidence before decisions."
profile = "cheap"
sandbox = "read-only"
prompt = "explorer.md"

[roles.worker]
description = "Implementation worker for one bounded, independently verifiable leaf task."
profile = "balanced"
sandbox = "workspace-write"
prompt = "worker.md"

[roles.tester]
description = "Verification specialist that runs focused checks and diagnoses failures."
profile = "balanced"
sandbox = "workspace-write"
prompt = "tester.md"

[roles.reviewer]
description = "Read-only reviewer for correctness, regression risk, and missing verification."
profile = "strong"
sandbox = "read-only"
prompt = "reviewer.md"

