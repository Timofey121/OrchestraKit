[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-kit"
version = "0.1.0"
description = "Portable Codex-first project orchestration configuration compiler"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestra = "orchestra_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

